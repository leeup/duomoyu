name: fetch-hotlist

on:
  # 每 5 分钟跑一次
  schedule:
    - cron: '*/5 * * * *'
  # 手动触发 (点 Actions 标签 → Run workflow)
  workflow_dispatch:
  # 改动 fetch.py 或前端 HTML 时也跑一次, 让 Pages 立即同步
  push:
    paths:
      - 'scripts/fetch.py'
      - '.github/workflows/fetch-hotlist.yml'
      - '多摸鱼.html'

# 只允许 contents:write 提交到 gh-pages 分支
permissions:
  contents: write

# 防止两个并发 run 同时推 gh-pages 引发冲突
concurrency:
  group: fetch-hotlist
  cancel-in-progress: false

# 直接 opt-in 到 Node.js 24 跑 actions, 消除 Node 20 弃用警告.
# (GitHub 公告: Node 20 将在 2026-06-02 默认换成 24, 2026-09-16 彻底下线.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Pull last-good data.json from gh-pages
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY##*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/data.json"
          echo "Trying $PAGES_URL"
          if curl -fsSL --max-time 20 "$PAGES_URL" -o data.json; then
            echo "✓ pulled existing data.json ($(wc -c < data.json) bytes)"
          else
            echo "⚠ no existing data.json, starting fresh"
            echo '{"platforms":{}}' > data.json
          fi

      - name: Run fetch.py
        run: python scripts/fetch.py --input data.json --output data.json
        # 即使部分平台失败也别让 step fail (last-good 已经处理了)
        continue-on-error: false

      - name: Prepare publish dir
        run: |
          mkdir -p _publish
          cp data.json _publish/
          # 把前端 HTML 同步到 Pages: 既以 index.html 提供 / 直达, 也保留中文文件名
          cp 多摸鱼.html _publish/index.html
          cp 多摸鱼.html _publish/多摸鱼.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          publish_branch: gh-pages
          # force_orphan 让 gh-pages 每次都是单 commit, 避免历史膨胀
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'auto: refresh hotlist data'
